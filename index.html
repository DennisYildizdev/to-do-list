<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A calm to-do list. Write down what's on your mind and focus on one step at a time.">
  <meta name="color-scheme" content="light dark">
  <title>One more step</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230071e3'/%3E%3Cpath d='m18 33 9 9 19-20' fill='none' stroke='%23fff' stroke-width='5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="./style.css">
  <script type="module">
    import init from './pkg/yapilacaklar.js';
    init().catch(() => {
      const warning = document.getElementById('storage-error');
      warning.textContent = 'The app couldn’t start. Open it from a web server or GitHub Pages, not as a local file.';
      warning.hidden = false;
    });
  </script>
</head>
<body>
  <header class="bar">
    <div class="bar-inner"><span class="brand">One more step.</span><span id="count"></span></div>
  </header>
  <main>
    <section id="focus" class="focus" aria-labelledby="focus-title">
      <p id="focus-eyebrow" class="eyebrow" hidden><span class="dot" aria-hidden="true"></span>Next</p>
      <h1 id="focus-title"></h1>
      <p id="focus-note" class="note" hidden></p>
      <div id="focus-actions" class="actions" hidden>
        <button type="button" id="done" class="primary">Mark as done</button>
        <button type="button" id="delete-next" class="quiet">Delete</button>
      </div>
    </section>

    <form id="task-form" novalidate>
      <label for="task-input">What’s your next small step?</label>
      <div class="row">
        <input id="task-input" type="text" name="task" placeholder="For example, read 10 pages of my book" autocomplete="off" maxlength="500" aria-describedby="input-error">
        <button type="submit" class="add">Add</button>
      </div>
      <p id="input-error" class="error" role="alert"></p>
    </form>
    <p id="storage-error" class="warning" role="alert" hidden></p>

    <ul id="task-list" aria-label="Other tasks" hidden></ul>

    <p class="privacy">Your list. Tasks are stored only in this browser.</p>
    <p id="announcement" class="sr-only" role="status" aria-live="polite"></p>
    <noscript><p class="warning">Turn on JavaScript in your browser to manage your tasks.</p></noscript>
  </main>
  <footer>You don’t have to finish everything today.</footer>
</body>
</html>
